# One-click public demo on Render (https://render.com/docs/blueprint-spec).
# Creates a free web service and a free PostgreSQL database. Payments are
# simulated (DEMO_MODE), and the demo data is reset each time the service starts.
services:
  - type: web
    name: pt-platform-demo
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/poc-platform
    buildCommand: npm ci && npm run build
    startCommand: npm run start:demo
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Build tools (Prisma CLI, tsx) are dev dependencies.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: pt-platform-demo-db
          property: connectionString
      - key: SESSION_PASSWORD
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: DEMO_RESET_ON_START
        value: "true"

databases:
  - name: pt-platform-demo-db
    plan: free
    region: frankfurt
    databaseName: ptp
    user: ptp
